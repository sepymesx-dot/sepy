/* Layout: full-screen pages cycling Winston red, black and navy; product = image page with an info page that slides up over it. */

      x.fillStyle='#6a35e8';x.font='600 20px '+FONT;x.fillText(r[0],ax,y);y+=34;
      x.fillStyle='#22174a';var f='500 25px '+FONT;wrap(r[1],f,W-2*PAD).forEach(function(l){x.font=f;x.direction=r[2]?'ltr':(rtl?'rtl':'ltr');x.textAlign=r[2]&&rtl?'right':(rtl?'right':'left');x.fillText(l,ax,y);y+=36});
      x.direction=rtl?'rtl':'ltr';x.textAlign=rtl?'right':'left';y+=12;
    });
    y+=6;x.fillStyle='#f3edff';x.beginPath();x.roundRect?x.roundRect(PAD,y,W-2*PAD,110,24):x.rect(PAD,y,W-2*PAD,110);x.fill();
    x.fillStyle='#6a6290';x.font='600 22px '+FONT;x.fillText(m.total[0],ax,y+40);
    x.fillStyle='#3c14a6';x.font='800 38px '+FONT;x.direction='ltr';x.textAlign=rtl?'right':'left';x.fillText(m.total[1],ax,y+88);x.direction=rtl?'rtl':'ltr';
    y+=150;
    if(m.note){x.fillStyle='#6a6290';var nf='400 20px '+FONT;wrap(m.note,nf,W-2*PAD).forEach(function(l){x.font=nf;x.fillText(l,ax,y);y+=30});y+=10}
    y+=14;x.fillStyle='#e6dcff';x.fillRect(PAD,y,W-2*PAD,3);y+=40;
    x.fillStyle='#22174a';x.font='500 20px '+FONT;x.direction='ltr';x.textAlign='center';
    x.fillText('WhatsApp / Tel: 09914449074  ·  '+ADMIN_MAIL,W/2,y);y+=32;x.fillText('Instagram: @sepyx1x2x3',W/2,y);y+=50;
    var out=document.createElement('canvas');out.width=W;out.height=y;out.getContext('2d').drawImage(c,0,0);
    var url;try{url=out.toDataURL('image/png')}catch(er2){if(img.src){img=new Image();paint();return}throw er2}
    try{var a=document.createElement('a');a.href=url;a.download=m.no+'.png';document.body.appendChild(a);a.click();a.remove()}catch(er){}
    var lb=$('#lbimg');lb.src=url;$('#lb').hidden=false;
  }
  img.onload=paint;img.onerror=paint;img.src='logo3d.webp';
}
/* ---------- navigation ---------- */
function place(instant){
  var sign=document.documentElement.dir==='rtl'?-1:1;
  $$('.pp').forEach(function(pp){
    var i=+pp.dataset.i;
    if(instant){pp.style.transition='none'}
    pp.style.transform='translateX('+(sign*(i-cur)*100)+'%)';
    pp.style.visibility=(view==='prods'&&Math.abs(i-cur)<=1)?'visible':'hidden';
    if(instant){void pp.offsetWidth;pp.style.transition=''}
  });
}
function show(v){
  view=v;
  var map={home:'#v-home',about:'#v-about',order:'#v-order',dorder:'#v-dorder',account:'#v-account',contact:'#v-contact',prods:'#v-prods'};
  Object.keys(map).forEach(function(k){$(map[k]).classList.toggle('on',k===v)});
  document.body.dataset.v=v;
  $('#v-land').classList.toggle('on',v==='land'||v==='home');$('#v-land').classList.toggle('under',v==='home');
  if(v!=='prods')closeInfo();
  $$('.view').forEach(function(x){if(x.classList.contains('on')&&x.id!=='v-land')x.scrollTop=0});
  place();updateChrome();
}
var VIEWS=['land','home','about','order','dorder','account','contact'];
function go(id){
  if(P.every(function(p){return p.id!==id})&&VIEWS.indexOf(id)<0)return;
  var i=P.map(function(p){return p.id}).indexOf(id);
  if(i>=0){closeInfo();cur=i;show('prods')}else show(id);
}
function closeInfo(){$$('.pp').forEach(function(p){p.classList.remove('open')});app.classList.remove('info')}
function openInfo(i){var pp=$$('.pp')[i];pp.classList.add('open');app.classList.add('info');var ip=$('.infopage',pp);if(ip)ip.scrollTop=0}
function step(d){var n=cur+d;if(n<0||n>=P.length)return;closeInfo();cur=n;place();updateChrome()}
function updateChrome(){
  var inP=view==='prods';
  $('#homeBtn').hidden=(view==='home'||view==='land');$('#landBtn').hidden=(view==='land');
  $('#pv').hidden=!inP;$('#nx').hidden=!inP;
  $('#pv').disabled=cur===0;$('#nx').disabled=cur===P.length-1;
  var c=$('#count');c.hidden=!inP;c.textContent=num(cur+1)+' '+T[lang].of+' '+num(P.length);
}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  var o=e.target.closest('[data-open]');if(o){openInfo(+o.dataset.open);return}
  var c=e.target.closest('[data-close]');if(c){closeInfo();return}
  var cp=e.target.closest('[data-copy]');if(cp){var v=cp.dataset.copy,t=T[lang];
    function ok(){cp.textContent=t.copied;setTimeout(function(){cp.textContent=t.copy},1400)}
    try{navigator.clipboard.writeText(v).then(ok,function(){})}catch(x){}return}
  var gb=e.target.closest('.gal button');if(gb){$('#lbimg').src=gb.dataset.src;$('#lb').hidden=false}
});
$('#homeBtn').addEventListener('click',function(){show('home')});
$('#landBtn').addEventListener('click',function(){show('land')});
$('#nx').addEventListener('click',function(){step(1)});
$('#pv').addEventListener('click',function(){step(-1)});
$('#lb').addEventListener('click',function(){$('#lb').hidden=true});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('#lb').hidden)$('#lb').hidden=true;else closeInfo()}
  if(view==='prods'&&!app.classList.contains('info')){var rtl=document.documentElement.dir==='rtl';
    if(e.key==='ArrowRight')step(rtl?-1:1);if(e.key==='ArrowLeft')step(rtl?1:-1)}
});
// swipe between products
(function(){var x0=null,y0=0;var el=$('#v-prods');
  el.addEventListener('touchstart',function(e){if(app.classList.contains('info'))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  el.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){var rtl=document.documentElement.dir==='rtl';step((dx<0)===rtl?1:-1)}
    else if(dy<-60&&Math.abs(dy)>Math.abs(dx)*1.5){openInfo(cur)}},{passive:true});
})();

/* ---------- 3D tilt + logo ---------- */
function tilt(target,box,my,mx){
  if(reduce)return;
  box.addEventListener('pointermove',function(e){var r=box.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;target.style.transform='rotateY('+(x*my*2)+'deg) rotateX('+(-y*mx*2)+'deg)'});
  box.addEventListener('pointerleave',function(){target.style.transform=''});
}
function bindTilt(){$$('[data-stage]').forEach(function(s){tilt($('.tilt',s),s,18,10)})}
var logo3d=$('#logo3d'),logoStage=$('#logoStage');
tilt(logo3d,logoStage,20,12);
if(!reduce){var t0=performance.now();(function sway(now){if((view==='land'||view==='home')&&!logoStage.matches(':hover')){var a=(now-t0)/1000;logo3d.style.transform='rotateY('+(Math.sin(a*.7)*10)+'deg) rotateX('+(Math.cos(a*.5)*4)+'deg)'}requestAnimationFrame(sway)})(t0)}

/* ---------- controls ---------- */
$('#langSel').addEventListener('change',function(){lang=this.value;try{localStorage.setItem('sepy_lang',lang)}catch(e){}closeInfo();render()});
var music=$('#music'),snd=$('#snd');
snd.addEventListener('click',function(){
  if(music.paused){var p=music.play();if(p&&p.catch)p.catch(function(){});music.volume=.55;snd.setAttribute('aria-pressed','true')}
  else{music.pause();snd.setAttribute('aria-pressed','false')}
});
document.addEventListener('play',function(e){if(e.target.tagName==='VIDEO'&&!music.paused){music.pause();snd.setAttribute('aria-pressed','false')}},true);
render();
var h=(location.hash||'').replace('#','');if(h&&h!=='land')go(h);
})();
</script>
